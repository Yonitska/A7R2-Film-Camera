name: Bug report
description: Report a reproducible problem with the camera app
body:
  - type: input
    id: version
    attributes:
      label: App version, camera model and firmware
      placeholder: v0.9.0-beta.5-a7r2.53 / ILCE-7RM2 / 4.01
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and actual result
      description: Which screen did you start from? Which keys did you press? What did the screen show last?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
  - type: textarea
    id: evidence
    attributes:
      label: Additional information
      description: Attach sanitized `SONYLUT/*.JSN` journals. Do not post passwords, private photos, signing keys, or LUTs you have no right to share.
